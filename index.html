    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #120a06;
        color: white;
      }
      body {
        font-family: 'Inter', sans-serif;
        user-select: none;
        -webkit-tap-highlight-color: transparent;

      #root {
        display: flex;
        flex-direction: column;

      @keyframes bounce-slow {

      .animate-bounce-slow {
        animation: bounce-slow 1s infinite ease-in-out;
      }
